databases:
  - name: apexprep-db
    databaseName: apexprep
    user: apexprep
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: apexprep-backend
    runtime: node
    plan: free
    rootDir: apexprep-backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate:prod && npm run start:prod
    healthCheckPath: /v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: apexprep-db
          property: connectionString
      - key: DATABASE_POOL_MAX
        value: 10
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: REFRESH_COOKIE_SECURE
        value: true
      - key: REFRESH_COOKIE_SAMESITE
        value: none
      - key: REFRESH_TOKEN_IN_BODY
        value: false
      - key: REQUIRE_VERIFIED_EMAIL
        value: false
      - key: DEFAULT_TENANT_SLUG
        value: dev-sandbox
      - key: MAIL_PROVIDER
        value: none
      - key: AI_PROVIDER
        value: none
      - key: AI_FALLBACK_PROVIDER
        value: none
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://apexprep.vercel.app
      - key: FRONTEND_URL
        value: https://apexprep.vercel.app
      - key: APP_PUBLIC_URL
        value: https://apexprep.vercel.app
