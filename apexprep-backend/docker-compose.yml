# Local infrastructure for development. The API itself runs with `npm run dev`.
# Values come from .env (copy .env.example). Ports bind to 127.0.0.1 only.
name: apexprep

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apexprep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-apexprep}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional local mail catcher, to test MAIL_PROVIDER=smtp end to end without a real provider:
  #   docker compose --profile mail up -d mailpit     → SMTP on 127.0.0.1:1025, inbox at http://127.0.0.1:8025
  # Not started by a plain `docker compose up`. It accepts any message and delivers nothing onward.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    profiles: ["mail"]
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgdata:
  redisdata:
